<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitter Will Not Steward the Profession — Theo Lipsky</title>
<style>
  :root {
    --bg: #132821;
    --text: #f1ede2;
    --muted: #9db8ab;
    --accent: #d6a75a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
  }

  @media (max-width: 480px) {
    main {
      padding: 3rem 1.25rem 3rem;
    }
  }

  .back {
    display: inline-block;
    margin-bottom: 3rem;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.02em;
  }

  .back:hover {
    color: var(--accent);
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin: 0 0 1.6rem;
  }

  .meta {
    margin: 0 0 0.5rem;
    font-size: 1rem;
    color: var(--muted);
  }

  .meta strong {
    color: var(--text);
    font-weight: 500;
  }

  .meta a {
    color: var(--muted);
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--muted) 40%, transparent);
    text-underline-offset: 2px;
  }

  .meta a:hover {
    color: var(--accent);
    text-decoration-color: var(--accent);
  }

  .read-link {
    display: inline-block;
    margin-top: 2.5rem;
    color: var(--text);
    text-decoration: none;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-size: 0% 1px;
    background-repeat: no-repeat;
    background-position: 0 100%;
    transition: background-size 0.25s ease, color 0.25s ease;
    padding-bottom: 1px;
  }

  .read-link:hover {
    color: var(--accent);
    background-size: 100% 1px;
  }

  footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Back</a>
  <h1>Twitter Will Not Steward the Profession</h1>
  <p class="meta"><strong>Venue:</strong> <a href="https://warontherocks.com/twitter-will-not-steward-the-profession/" target="_blank" rel="noopener">War on the Rocks</a></p>
  <p class="meta"><strong>Dated:</strong> July 30, 2021</p>
  <p class="meta"><strong>By:</strong> Theo Lipsky</p>

  <a class="read-link" href="https://warontherocks.com/twitter-will-not-steward-the-profession/" target="_blank" rel="noopener">Read the piece &rarr;</a>

  <footer>Views expressed in this writing are the author's own and do not represent the views of any other institution.</footer>
</main>
</body>
</html>
