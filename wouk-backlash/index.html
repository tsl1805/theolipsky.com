<!DOCTYPE html>

<head>

<title>Wouk Backlash — Theo Lipsky</title>
<style>
  :root {
    --bg: #132821;
    --text: #f1ede2;
    --muted: #9db8ab;
    --accent: #d6a75a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 6rem 1.5rem 5rem;
  }

  @media (max-width: 480px) {
    main {
      padding: 3.5rem 1.25rem 3rem;
    }
  }

  .back {
    display: inline-block;
    margin-bottom: 3rem;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.02em;
  }

  .back:hover {
    color: var(--accent);
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin: 0 0 1.6rem;
  }

  .meta {
    margin: 0 0 0.5rem;
    font-size: 1rem;
    color: var(--muted);
  }

  .meta strong {
    color: var(--text);
    font-weight: 500;
  }

  .read-link {
    display: inline-block;
    margin-top: 2.5rem;
    color: var(--text);
    text-decoration: none;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-size: 0% 1px;
    background-repeat: no-repeat;
    background-position: 0 100%;
    transition: background-size 0.25s ease, color 0.25s ease;
    padding-bottom: 1px;
  }

  .read-link:hover {
    color: var(--accent);
    background-size: 100% 1px;
  }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Back</a>
  <h1>Wouk Backlash</h1>
  <p class="meta"><strong>Source:</strong> Metropolitan Review</p>
